name: contracts

on:
  push:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.10.0

      - run: forge build --sizes

      # Fork tests: the HSK testnet suite trades through the live HSKSwap factory, pools and router; the mainnet suite
      # checks the TWAP feeds against APRO and buys WHSK in the real HSKSwap pool.
      - run: forge test -vv
