[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
hsk = "https://mainnet.hsk.xyz"
hsk_testnet = "https://testnet.hsk.xyz"

[fmt]
line_length = 120
tab_width = 4
quote_style = "double"
